<h2>Kuis Gangguan Adrenal, Cushing, dan Malnutrisi Dewasa</h2>
<div id="app"></div>

<script>
const Q=[
{t:"C1-C2",s:"Gejala klinis sindrom Cushing yang paling khas sebagai petunjuk awal adalah...",o:["Obesitas sentral (truncal obesity) disertai wajah bulat dan penumpukan lemak supraklavikula","Penurunan berat badan drastis tanpa penyebab jelas","Hiperpigmentasi kulit yang meluas","Hiponatremia berat dengan hiperkalemia","Rambut rontok dan kulit kering"],w:["Penurunan berat badan drastis tidak sesuai dengan sindrom Cushing, yang umumnya menyebabkan penambahan lemak sentral.","Hiperpigmentasi kulit merupakan ciri insufisiensi adrenal primer akibat ACTH tinggi, bukan Cushing.","Hiponatremia berat dengan hiperkalemia adalah gambaran insufisiensi adrenal primer, bukan kelebihan kortisol.","Rambut rontok dan kulit kering adalah gejala hipotiroid, bukan sindrom Cushing."],e:"Kelebihan glukokortikoid menyebabkan obesitas sentral, wajah bulat (moon face), penumpukan lemak di supraklavikula dan punggung leher (buffalo hump), striae ungu, kulit tipis, mudah memar, hipertensi, dan osteoporosis. Obesitas sentral merupakan gejala utama yang menjadi petunjuk awal dalam PPT."},
{t:"C1-C2",s:"Untuk membuktikan adanya kelebihan kortisol pada dugaan sindrom Cushing, pemeriksaan yang dianjurkan dalam PPT adalah...",o:["Dua kali pemeriksaan kortisol bebas urin 24 jam, kortisol saliva malam hari, dan uji supresi deksametason malam","Kadar TSH dan fT4 sebagai pemeriksaan pertama","Kadar aldosteron dan renin tanpa pemeriksaan kortisol","Kadar kalsium dan hormon paratiroid","Kadar GH puasa dan IGF-1"],w:["TSH dan fT4 menilai fungsi tiroid dan tidak membuktikan kelebihan kortisol.","Aldosteron dan renin digunakan untuk skrining aldosteronisme primer, bukan untuk membuktikan kelebihan kortisol.","Kalsium dan PTH menilai fungsi paratiroid, tidak berkaitan dengan diagnosis hiperkortisolisme.","GH dan IGF-1 menilai fungsi hipofisis untuk pertumbuhan, bukan kelebihan kortisol."],e:"Diagnosis sindrom Cushing dimulai dengan membuktikan kelebihan kortisol, yaitu dua kali kortisol bebas urin 24 jam, kortisol saliva malam hari, dan uji supresi deksametason semalam. Setelah terbukti, langkah berikutnya adalah mencari penyebab dengan pemeriksaan ACTH."},
{t:"C1-C2",s:"Pada sindrom Cushing, kadar ACTH kurang dari 10 pg/mL menunjukkan...",o:["ACTH-independent (kortisol berasal dari kelenjar adrenal sendiri)","ACTH-dependent yang berasal dari hipofisis","Cushing disease akibat adenoma hipofisis","Sindrom ACTH ektopik dari tumor paru","Pseudo-Cushing syndrome akibat alkohol"],w:["ACTH-dependent ditandai ACTH normal atau tetap tinggi di atas 15 pg/mL, sehingga tidak sesuai dengan ACTH kurang dari 10.","Cushing disease adalah ACTH-dependent, sehingga ACTH biasanya normal atau tinggi, bukan kurang dari 10.","Sindrom ACTH ektopik juga ACTH-dependent, sehingga ACTH tidak kurang dari 10 pg/mL.","Pseudo-Cushing merupakan hiperkortisolemia sekunder akibat kondisi lain; penilaiannya tidak ditentukan dengan batas ACTH tersebut."],e:"Menurut PPT, ACTH kurang dari 10 pg/mL menunjukkan penyebab ACTH-independent, yaitu adenoma atau karsinoma adrenal, sehingga sekresi kortisol berasal dari kelenjar adrenal. ACTH normal atau tetap tinggi di atas 15 pg/mL mengarah ke ACTH-dependent."},
{t:"C1-C2",s:"Kadar ACTH yang normal atau menetap tinggi lebih dari 15 pg/mL, disertai kortisol tinggi, menunjukkan...",o:["Sindrom Cushing ACTH-dependent, misalnya Cushing disease atau sindrom ACTH ektopik","Adenoma adrenal unilateral penghasil kortisol","Karsinoma adrenal dengan ACTH tertekan","Hiperaldosteronisme primer","Feokromositoma dengan kelebihan katekolamin"],w:["Adenoma adrenal unilateral menekan ACTH, sehingga ACTH biasanya kurang dari 10 pg/mL, bukan tinggi.","Karsinoma adrenal juga menekan ACTH, bukan menyebabkan ACTH tinggi.","Hiperaldosteronisme primer ditandai aldosteron tinggi dengan renin rendah, bukan kortisol tinggi dengan ACTH tinggi.","Feokromositoma berkaitan dengan katekolamin, bukan kortisol dan ACTH."],e:"ACTH normal atau tetap tinggi di atas 15 pg/mL menunjukkan sumber ACTH-dependent, yang dapat berasal dari hipofisis (Cushing disease), sekresi ACTH ektopik, atau sekresi CRH ektopik. Penentuan jenisnya kemudian dilanjutkan dengan pencitraan dan uji lanjutan."},
{t:"C1-C2",s:"Cushing disease didefinisikan sebagai sindrom Cushing yang disebabkan oleh...",o:["Adenoma hipofisis penghasil ACTH","Adenoma adrenal penghasil kortisol","Karsinoma paru penghasil ACTH","Penggunaan glukokortikoid eksogen","Hiperplasia adrenal kongenital"],w:["Adenoma adrenal penghasil kortisol menyebabkan sindrom Cushing ACTH-independent, bukan Cushing disease.","Karsinoma paru penghasil ACTH menyebabkan sindrom ACTH ektopik, bukan Cushing disease.","Penggunaan glukokortikoid eksogen menyebabkan sindrom Cushing iatrogenik, bukan Cushing disease.","Hiperplasia adrenal kongenital menyebabkan defisiensi enzim dan kelebihan androgen, bukan kelebihan kortisol dari adenoma hipofisis."],e:"Cushing disease adalah sindrom Cushing akibat adenoma hipofisis yang menghasilkan ACTH sehingga kelenjar adrenal memproduksi kortisol berlebihan. Ini merupakan penyebab ACTH-dependent yang paling sering dibahas dalam PPT."},
{t:"C1-C2",s:"Pseudo-Cushing syndrome ditandai oleh...",o:["Hiperkortisolemia sekunder akibat kondisi lain, misalnya alkohol, depresi, anoreksia, atau malnutrisi, tanpa kelainan adrenal primer","Hiperaldosteronisme dengan hipokalemia berat","Penyakit Addison dengan hiperpigmentasi","Feokromositoma dengan krisis katekolamin","Karsinoma adrenal dengan massa besar"],w:["Hiperaldosteronisme dengan hipokalemia berat adalah sindrom Conn, bukan pseudo-Cushing.","Penyakit Addison ditandai insufisiensi kortisol dengan hiperpigmentasi, bukan kelebihan kortisol.","Feokromositoma adalah tumor medula penghasil katekolamin, bukan kondisi pseudo-Cushing.","Karsinoma adrenal adalah kelainan adrenal primer, sedangkan pseudo-Cushing tidak disebabkan kelainan adrenal primer."],e:"Pseudo-Cushing menunjukkan gambaran klinis dan biokimia menyerupai sindrom Cushing, tetapi hiperkortisolemia biasanya sekunder akibat kondisi lain seperti alkohol, depresi, panic disorder, anoreksia nervosa, obesitas, malnutrisi, atau olahraga kronis. Penyebab ini perlu dibedakan dari Cushing sejati."},
{t:"C1-C2",s:"Gangguan elektrolit yang paling khas pada insufisiensi adrenal primer (penyakit Addison) adalah...",o:["Hiponatremia, ditemukan pada sekitar 80 persen pasien","Hipernatremia berat sejak awal","Hipokalsemia berat dengan tetani","Hipomagnesemia berat tanpa hiperkalemia","Hipokalemia berat pada semua pasien"],w:["Hipernatremia berat sejak awal tidak sesuai dengan gambaran khas insufisiensi adrenal primer.","Hipokalsemia berat dengan tetani bukan gambaran khas insufisiensi adrenal; hiperkalsemia justru dapat ditemukan pada 6 persen pasien.","Hipomagnesemia berat tanpa hiperkalemia tidak sesuai, karena hiperkalemia ditemukan pada sekitar 40 persen pasien.","Hipokalemia berat pada semua pasien bertentangan dengan PPT, karena defisiensi aldosteron menyebabkan retensi kalium."],e:"Hiponatremia merupakan gangguan elektrolit khas insufisiensi adrenal primer dan ditemukan pada sekitar 80 persen pasien. Hiperkalemia terjadi pada sekitar 40 persen pasien saat diagnosis awal, karena defisiensi aldosteron menurunkan ekskresi kalium."},
{t:"C1-C2",s:"Ciri khas insufisiensi adrenal primer yang membedakannya dari insufisiensi adrenal sekunder adalah...",o:["Hiperpigmentasi kulit akibat stimulasi ACTH yang berlebihan pada melanosit","Hipotensi berat tanpa gangguan elektrolit","Peningkatan kadar kortisol dan ACTH secara bersamaan","Hipertensi dengan hipokalemia","Kulit yang kering tanpa perubahan warna"],w:["Hipotensi berat tanpa gangguan elektrolit tidak membedakan primer dari sekunder, dan pada primer sering disertai hiponatremia.","Peningkatan kortisol dan ACTH bersamaan tidak sesuai dengan insufisiensi adrenal primer, karena kortisol rendah.","Hipertensi dengan hipokalemia adalah gambaran hiperaldosteronisme, bukan insufisiensi adrenal primer.","Kulit kering tanpa perubahan warna tidak menjadi ciri khas insufisiensi adrenal primer menurut PPT."],e:"Insufisiensi adrenal primer kehilangan sekresi glukokortikoid dan mineralokortikoid. Hiperpigmentasi terjadi karena stimulasi ACTH berlebih pada melanosit, sedangkan pada insufisiensi sekunder mineralokortikoid tetap terjaga karena sistem RAA masih bekerja dan hiperpigmentasi tidak ditemukan."},
{t:"C1-C2",s:"Pencetus utama krisis adrenal pada pasien dengan insufisiensi adrenal kronis adalah...",o:["Sepsis atau stres bedah yang meningkatkan kebutuhan kortisol","Konsumsi kopi dalam jumlah normal","Olahraga ringan setiap pagi","Diet tinggi serat tanpa kalori berlebih","Vaksinasi rutin tanpa gejala"],w:["Konsumsi kopi dalam jumlah normal tidak meningkatkan kebutuhan kortisol secara bermakna dan bukan pencetus krisis yang dibahas PPT.","Olahraga ringan setiap pagi tidak tercantum sebagai pencetus krisis adrenal.","Diet tinggi serat tanpa kalori berlebih tidak memicu krisis adrenal.","Vaksinasi rutin tanpa gejala tidak termasuk pencetus krisis adrenal."],e:"Krisis adrenal umumnya dipicu oleh sepsis atau stres bedah pada pasien insufisiensi adrenal kronis. Penyebab lain termasuk perdarahan bilateral kelenjar adrenal akibat terapi antikoagulan, dan penghentian steroid yang mendadak pada pasien dengan atrofi adrenal akibat pemakaian steroid kronis."},
{t:"C1-C2",s:"Penatalaksanaan awal krisis adrenal menurut PPT adalah...",o:["Infus glukosa 5 persen dalam larutan salin normal, dan hidrokortison intravena bolus 100 mg dilanjutkan infus 10 mg per jam","Kortikosteroid oral dosis rendah sebagai terapi rumatan","Diuretik dan pembatasan cairan ketat","Antibiotik spektrum sempit tanpa steroid","Penundaan steroid sampai hasil kortisol tersedia"],w:["Kortikosteroid oral dosis rendah tidak cukup untuk krisis adrenal yang memerlukan terapi intravena segera.","Pembatasan cairan dan diuretik justru memperburuk dehidrasi dan hipotensi pada krisis adrenal.","Antibiotik tidak menggantikan steroid; steroid diberikan segera tanpa menunggu hasil pemeriksaan.","Penundaan steroid sampai hasil kortisol tersedia berbahaya karena krisis adrenal merupakan kondisi emergensi."],e:"Penatalaksanaan krisis adrenal berupa pengisian kembali glukokortikoid dan penggantian defisit natrium dan air. Dilakukan infus 5 persen glukosa dalam salin normal, dan hidrokortison intravena bolus 100 mg dilanjutkan infus 10 mg per jam, atau alternatif 100 mg intravena setiap 6 jam."},
{t:"C1-C2",s:"Menurut kerangka GLIM, kriteria fenotipik penurunan berat badan tidak disengaja pada dewasa adalah...",o:["Penurunan lebih dari 5 persen dalam 6 bulan, atau lebih dari 10 persen dalam lebih dari 6 bulan","Penurunan lebih dari 1 persen dalam 1 bulan","Penurunan lebih dari 20 persen dalam 1 minggu","Penurunan berat badan apa pun tanpa batas waktu","Penurunan berat badan kurang dari 2 persen dalam setahun"],w:["Penurunan lebih dari 1 persen dalam 1 bulan terlalu sensitif dan tidak sesuai dengan ambang GLIM.","Penurunan lebih dari 20 persen dalam 1 minggu tidak realistis sebagai ambang klinis dan tidak sesuai dengan GLIM.","Penurunan berat badan apa pun tanpa batas waktu tidak sesuai dengan prinsip ambang GLIM yang memerlukan rentang waktu.","Penurunan kurang dari 2 persen dalam setahun tidak memenuhi kriteria fenotipik GLIM."],e:"GLIM menggunakan penurunan berat badan tidak disengaja lebih dari 5 persen dalam 6 bulan, atau lebih dari 10 persen dalam lebih dari 6 bulan sebagai kriteria fenotipik. Diagnosis malnutrisi memerlukan minimal satu fenotipik dan satu etiologik."},
{t:"C1-C2",s:"Pada pasien dewasa dengan kondisi stabil, kisaran praktis awal kebutuhan energi menurut PPT adalah...",o:["25-30 kkal per kg berat badan per hari","10-15 kkal per kg berat badan per hari","40-50 kkal per kg berat badan per hari","60-70 kkal per kg berat badan per hari","100 kkal per kg berat badan per hari"],w:["10-15 kkal per kg berat badan per hari terlalu rendah untuk pasien dewasa stabil dan dapat memperburuk malnutrisi.","40-50 kkal per kg berat badan per hari melampaui kisaran awal dan berisiko pada pasien yang berisiko refeeding.","60-70 kkal per kg berat badan per hari tidak sesuai dengan kisaran praktis pasien dewasa stabil.","100 kkal per kg berat badan per hari tidak sesuai dan terlalu tinggi sebagai target awal."],e:"Pada pasien stabil, kisaran praktis awal energi adalah 25-30 kkal per kg berat badan per hari, lalu disesuaikan dengan usia, aktivitas, penyakit, dan respons. Perhitungan prediktif atau kalorimetri indirek dapat digunakan bila tersedia, dengan hati-hati pada pasien berisiko refeeding."},
{t:"C1-C2",s:"Rute nutrisi pertama yang dipilih pada pasien dewasa yang masih dapat menelan dan saluran cerna berfungsi adalah...",o:["Oral, dengan optimalisasi makan, fortifikasi, dan suplemen nutrisi oral bila perlu","Parenteral total sejak awal","Enteral melalui sonde pada semua pasien","Dekstrosa intravena saja","Menunda nutrisi sampai pasien sembuh"],w:["Parenteral total sejak awal tidak sesuai, karena parenteral dipertimbangkan bila saluran cerna tidak dapat digunakan.","Enteral melalui sonde pada semua pasien tidak diperlukan; sonde dipakai bila oral tidak mencukupi tetapi usus berfungsi.","Dekstrosa intravena saja tidak memenuhi kebutuhan energi dan protein serta bukan pilihan rute pertama.","Menunda nutrisi sampai pasien sembuh berbahaya dan bertentangan dengan tujuan terapi nutrisi."],e:"Algoritme rute menurut PPT mengutamakan oral bila aman menelan dan pencernaan berfungsi, dengan optimalisasi makan biasa, fortifikasi, dan suplemen nutrisi oral bila diperlukan. Enteral dipilih bila oral tidak mencukupi tetapi usus berfungsi, dan parenteral bila saluran cerna tidak dapat digunakan."},
{t:"C1-C2",s:"Mekanisme refeeding syndrome berkaitan dengan pemberian karbohidrat yang memicu...",o:["Peningkatan insulin yang memindahkan fosfat, kalium, dan magnesium ke dalam sel","Peningkatan glukagon yang mengeluarkan fosfat melalui ginjal","Penurunan insulin yang meningkatkan kadar fosfat serum","Pelepasan kalium dari sel ke sirkulasi","Peningkatan absorpsi natrium di usus halus"],w:["Peningkatan glukagon dan ekskresi fosfat melalui ginjal bukan mekanisme utama refeeding syndrome setelah karbohidrat diberikan.","Penurunan insulin tidak sesuai, karena karbohidrat justru meningkatkan insulin.","Pelepasan kalium dari sel ke sirkulasi bertentangan dengan mekanisme refeeding, karena kalium masuk ke sel.","Absorpsi natrium di usus halus bukan mekanisme utama yang dijelaskan dalam PPT untuk refeeding syndrome."],e:"Pemberian karbohidrat meningkatkan insulin, yang mendorong fosfat, kalium, dan magnesium masuk ke dalam sel. Akibatnya kadar serum turun dan dapat menyebabkan aritmia, gangguan napas, dan kelemahan. Pada pasien berisiko, elektrolit perlu dinilai dan dikoreksi, dan tiamin diberikan sesuai protokol."},
{t:"C3-C4",s:"Wanita 42 tahun dengan wajah bulat (moon face), buffalo hump, striae ungu, hipertensi, dan intoleransi glukosa. Kortisol bebas urin 24 jam meningkat dua kali pemeriksaan. ACTH plasma 40 pg/mL. MRI hipofisis menunjukkan mikroadenoma. Diagnosis dan terapi lini pertama yang tepat adalah...",o:["Cushing disease (ACTH-dependent) dengan reseksi adenoma hipofisis melalui pembedahan transsfenoidal","Adenoma adrenal unilateral dengan adrenalektomi tanpa pemeriksaan hipofisis","Hiperaldosteronisme primer dengan spironolakton","Karsinoma adrenal dengan kemoterapi","Pseudo-Cushing akibat depresi tanpa terapi spesifik"],w:["Adenoma adrenal unilateral menyebabkan ACTH tertekan (kurang dari 10 pg/mL), sedangkan pada kasus ACTH 40 pg/mL.","Hiperaldosteronisme primer ditandai aldosteron tinggi dan hipokalemia, bukan gambaran moon face dan ACTH tinggi.","Karsinoma adrenal juga menekan ACTH dan tidak sesuai dengan mikroadenoma hipofisis penghasil ACTH.","Pseudo-Cushing tidak menghasilkan kadar ACTH dan mikroadenoma hipofisis seperti kasus ini; tidak sesuai dengan gambaran yang ada."],e:"ACTH 40 pg/mL, yaitu di atas 15 pg/mL, dengan kortisol tinggi menunjukkan ACTH-dependent. Mikroadenoma hipofisis penghasil ACTH mengarah ke Cushing disease. Terapi lini pertama adalah reseksi transsfenoidal. Stop kortikosteroid eksogen dan obat penghambat kortisol dipertimbangkan bila operasi tidak berhasil atau tidak memungkinkan."},
{t:"C3-C4",s:"Pria 50 tahun dengan hipertensi dan massa adrenal kiri 6 cm pada CT. Kortisol serum dan urin tinggi, dengan kadar ACTH plasma 4 pg/mL. Diagnosis dan langkah lanjut yang paling tepat adalah...",o:["Sindrom Cushing ACTH-independent dari massa adrenal; evaluasi keganasan dan pertimbangan adrenalektomi, dengan waspada karsinoma karena ukuran besar","Cushing disease; langsung operasi transsfenoidal","Hiperaldosteronisme primer; langsung spironolakton","Insufisiensi adrenal primer; langsung hidrokortison","Massa jinak tanpa pemeriksaan lanjutan karena kadar ACTH normal"],w:["Cushing disease ditandai ACTH tinggi, sedangkan pada kasus ini ACTH 4 pg/mL yang rendah, sehingga operasi hipofisis tidak sesuai.","Hiperaldosteronisme primer ditandai aldosteron tinggi dengan renin rendah; tidak sesuai dengan kortisol tinggi dan ACTH rendah.","Insufisiensi adrenal primer ditandai kortisol rendah, sedangkan pada kasus ini kortisol tinggi.","ACTH tidak normal karena kadar 4 pg/mL berada di bawah 10 pg/mL, dan massa 6 cm tidak boleh dianggap jinak tanpa pemeriksaan lanjutan."],e:"ACTH kurang dari 10 pg/mL dengan kortisol tinggi menunjukkan sindrom Cushing ACTH-independent yang berasal dari adenoma atau karsinoma adrenal. Massa berukuran 6 cm perlu dievaluasi untuk keganasan dengan pencitraan lanjutan dan pemeriksaan histopatologi. Terapi definitif berupa adrenalektomi bila sesuai."},
{t:"C3-C4",s:"Pasien dengan prednisolon 25 mg per hari selama 2 tahun ingin dihentikan. Cara penurunan dosis yang paling tepat menurut protokol PPT adalah...",o:["Turunkan 25 persen setiap 4 hari bila dosis di atas 20 mg, lalu turunkan 2,5 mg setiap 7 hari untuk dosis 10-20 mg","Hentikan mendadak agar pasien cepat bebas steroid","Turunkan 10 mg setiap hari sampai habis","Lanjutkan 25 mg tanpa perubahan seumur hidup","Ganti dengan diuretik tanpa penurunan steroid"],w:["Penghentian mendadak berisiko memicu krisis adrenal karena atrofi adrenal akibat pemakaian steroid kronis.","Penurunan 10 mg setiap hari terlalu cepat dan tidak sesuai dengan protokol bertahap PPT.","Melanjutkan dosis 25 mg tanpa perubahan tidak sesuai dengan tujuan menghentikan steroid dan tetap menimbulkan efek samping.","Diuretik tidak menggantikan glukokortikoid dan tidak mencegah insufisiensi adrenal."],e:"Pada penghentian glukokortikoid, dosis di atas 20 mg diturunkan 25 persen setiap 4 hari, dosis 10-20 mg diturunkan 2,5 mg setiap 7 hari, dan dosis di bawah 10 mg diturunkan 2,5 mg setiap 15 hari. Penghentian yang terlalu cepat dapat menimbulkan insufisiensi adrenal dan krisis adrenal."},
{t:"C3-C4",s:"Pasien 55 tahun dengan pneumonia berat dan sepsis, hipotensi refrakter terhadap katekolamin, hiponatremia, hiperkalemia, dan hipoglikemia. Ia pernah mendapat steroid jangka panjang yang dihentikan mendadak 1 minggu lalu. Tindakan awal yang paling tepat adalah...",o:["Hidrokortison intravena segera, infus glukosa 5 persen dalam salin normal, dan koreksi cairan serta elektrolit","Menunggu hasil kortisol serum sebelum memberi steroid","Diuretik untuk mengatasi hiponatremia","Insulin untuk mengatasi hipoglikemia tanpa steroid","Antibiotik saja tanpa steroid dan cairan"],w:["Menunggu hasil kortisol serum menunda terapi pada krisis adrenal yang mengancam jiwa dan tidak sesuai dengan prinsip penatalaksanaan emergensi.","Diuretik justru memperburuk hipovolemia dan hiponatremia pada krisis adrenal.","Insulin pada hipoglikemia krisis adrenal tidak mengatasi defisit kortisol dan dapat memperberat hipoglikemia.","Antibiotik penting untuk sepsis, tetapi tidak menggantikan steroid dan cairan pada krisis adrenal."],e:"Krisis adrenal dengan hipotensi refrakter, hiponatremia, hiperkalemia, dan hipoglikemia pada pasien dengan riwayat steroid jangka panjang dan penghentian mendadak adalah insufisiensi adrenal akut yang mengancam jiwa. Terapi segera berupa hidrokortison intravena dan koreksi cairan serta elektrolit, dengan antibiotik untuk sepsis."},
{t:"C3-C4",s:"Pasien dengan dugaan insufisiensi adrenal akut yang belum dapat dipastikan. Menurut PPT, dosis hidrokortison yang dapat diberikan adalah...",o:["50 mg intravena setiap 6 jam atau 100 mg intravena setiap 8 jam","5 mg intravena sekali sehari","10 mg per oral setiap 24 jam","1 gram intravena sekali","0,5 mg intramuskular sekali seumur hidup"],w:["5 mg intravena sekali sehari terlalu rendah untuk krisis adrenal akut dan tidak sesuai dengan dosis yang dianjurkan.","10 mg per oral setiap 24 jam tidak cukup dan tidak memadai pada kondisi emergensi.","1 gram intravena sekali tidak sesuai dengan dosis yang dianjurkan dan berisiko efek samping.","0,5 mg intramuskular sekali seumur hidup merupakan dosis deksametason untuk emergensi yang tidak sesuai dengan dosis hidrokortison yang dianjurkan."],e:"Pada insufisiensi adrenal akut, PPT menganjurkan hidrokortison 50 mg intravena setiap 6 jam atau 100 mg intravena setiap 8 jam, dilanjutkan dengan fludrokortison 50 mikrogram per oral per hari selama 7 hari. Terapi diberikan segera saat dicurigai, tidak menunggu konfirmasi laboratorium."},
{t:"C3-C4",s:"Pria 45 tahun dengan kelemahan, hiperpigmentasi kulit, dan hipotensi. Kortisol serum pagi 6 mcg/dL. Setelah stimulasi ACTH 250 mcg, kortisol 60 menit hanya naik kurang dari 25 persen dan ACTH tinggi. Diagnosis yang paling tepat adalah...",o:["Insufisiensi adrenal primer (penyakit Addison)","Insufisiensi adrenal sekunder akibat defisiensi ACTH","Sindrom Cushing ACTH-dependent","Hiperaldosteronisme primer","Feokromositoma"],w:["Insufisiensi adrenal sekunder memiliki ACTH rendah atau tidak sesuai, sedangkan pada kasus ini ACTH tinggi.","Sindrom Cushing menyebabkan kortisol tinggi, bukan kortisol rendah dengan hiperpigmentasi.","Hiperaldosteronisme primer menyebabkan hipertensi dan hipokalemia, bukan hiperpigmentasi dengan kortisol rendah.","Feokromositoma menyebabkan hipertensi episodik dengan katekolamin tinggi, bukan kortisol rendah dan hipotensi."],e:"Kortisol pagi 6 mcg/dL kurang dari 10 mcg/dL, dan kortisol setelah stimulasi ACTH tidak naik minimal 25 persen, dengan ACTH tinggi. Ini menunjukkan insufisiensi adrenal primer. Hiperpigmentasi juga khas karena stimulasi ACTH berlebih pada melanosit."},
{t:"C3-C4",s:"Pria 40 tahun dengan hipertensi, kalium 2,9 mmol/L, renin plasma rendah, dan aldosteron tinggi. CT menunjukkan adenoma adrenal kiri unilateral 2 cm. Terapi definitif yang paling tepat adalah...",o:["Adrenalektomi laparoskopi pada adenoma unilateral","Spironolakton saja pada semua kasus tanpa pembedahan","Radioiodin untuk mengecilkan adenoma","Levotiroksin untuk menekan aldosteron","Diet tinggi kalium tanpa terapi lain"],w:["Spironolakton saja tidak dianjurkan sebagai terapi definitif pada adenoma unilateral yang dapat diangkat; pada hiperplasia, spironolakton menjadi pilihan.","Radioiodin tidak digunakan untuk adenoma penghasil aldosteron dan tidak sesuai dengan patofisiologinya.","Levotiroksin adalah hormon tiroid dan tidak menekan aldosteron.","Diet tinggi kalium tidak mengatasi hipokalemia yang disebabkan kelebihan aldosteron dan tidak merupakan terapi definitif."],e:"Sindrom Conn akibat adenoma aldosteron unilateral (renin rendah, aldosteron tinggi, hipokalemia, hipertensi) diterapi dengan pengangkatan tumor secara laparoskopi. Pada hiperplasia bilateral, adrenalektomi tidak dianjurkan karena sekitar 70 persen pasien tetap hipertensi, sehingga spironolakton menjadi terapi pilihan."},
{t:"C3-C4",s:"Wanita 35 tahun dengan serangan sakit kepala berat, berdebar, dan keringat berlebih secara episodik, serta hipertensi. Diagnosis dan terapi preoperatif yang tepat adalah...",o:["Feokromositoma; blokade alfa-adrenergik dulu, kemudian beta-blocker, sebelum reseksi tumor","Feokromositoma; langsung beta-blocker tanpa blokade alfa","Sindrom Cushing; langsung kortikosteroid","Hipertiroid; antitiroid saja","Migrain murni; analgesik tanpa pemeriksaan katekolamin"],w:["Beta-blocker tanpa blokade alfa sebelumnya berisiko memicu krisis hipertensi, sehingga tidak tepat sebagai langkah awal.","Sindrom Cushing menyebabkan obesitas sentral dan striae, bukan episode berdebar dan keringat dengan hipertensi episodik.","Hipertiroid tidak menjelaskan triad klasik sakit kepala, palpitasi, dan diaforesis dengan hipertensi episodik.","Migrain tidak menjelaskan hipertensi episodik dengan triad klasik; diagnosis perlu pemeriksaan katekolamin."],e:"Triad klasik sakit kepala berat, palpitasi, dan diaforesis dengan hipertensi episodik mengarah ke feokromositoma. Terapi utama adalah reseksi lengkap. Sebelum operasi, blokade alfa-adrenergik diberikan lebih dahulu, lalu beta-blocker, untuk mencegah krisis hipertensi dan aritmia saat tumor dimanipulasi."},
{t:"C3-C4",s:"Pasien dengan massa adrenal yang ditemukan secara tidak sengaja pada CT scan. Menurut PPT, pernyataan yang paling tepat adalah...",o:["Prevalensinya sekitar 2 hingga 5 persen, dan mayoritas adalah adenoma nonfungsional; sekitar 25 persen nodul aktif secara hormonal","Semua massa adrenal yang ditemukan tidak sengaja harus diangkat","Massa adrenal selalu ganas dan memerlukan kemoterapi","Massa adrenal tidak pernah menghasilkan hormon","Prevalensi massa adrenal lebih dari 50 persen pada populasi umum"],w:["Semua massa harus diangkat tidak sesuai, karena mayoritas nodul adalah adenoma nonfungsional yang tidak memerlukan operasi.","Massa adrenal selalu ganas tidak sesuai dengan PPT yang menyebut mayoritas adalah adenoma nonfungsional.","Massa adrenal tidak pernah menghasilkan hormon bertentangan dengan PPT, yang menyebut sekitar 25 persen nodul aktif secara hormonal.","Prevalensi lebih dari 50 persen tidak sesuai dengan data prevalensi 2 hingga 5 persen pada populasi."],e:"Massa adrenal sering ditemukan tidak sengaja pada CT scan dengan prevalensi 2 hingga 5 persen. Mayoritas adalah adenoma adrenokortikal yang tidak aktif secara endokrin, sedangkan sekitar 25 persen nodul aktif secara hormonal dan dapat menghasilkan kortisol, aldosteron, atau katekolamin. Evaluasi hormonal diperlukan untuk menentukan terapi."},
{t:"C3-C4",s:"Pasien dengan karsinoma adrenokortikal (ACC) yang dianalisis histopatologi dengan skor Weiss. Kriteria histopatologi yang mengarah ke keganasan menurut PPT adalah...",o:["Mitosis lebih dari 5 per lapang pandang besar, mitosis atipikal, nekrosis, dan invasi vena","Inti kecil seragam tanpa mitosis","Sel dengan clear cell lebih dari 25 persen","Kapsul utuh tanpa invasi","Mitosis kurang dari 1 per lapang pandang"],w:["Inti kecil seragam tanpa mitosis merupakan gambaran jinak dan tidak sesuai dengan kriteria ganas.","Clear cell lebih dari 25 persen tidak sesuai; kriteria Weiss menggunakan clear cell kurang dari 25 persen.","Kapsul utuh tanpa invasi merupakan gambaran yang lebih mengarah ke jinak, bukan keganasan.","Mitosis kurang dari 1 per lapang pandang tidak sesuai dengan kriteria ganas yang menggunakan mitosis lebih dari 5."],e:"Skor Weiss menilai tingkat inti yang tinggi, mitosis lebih dari 5 per lapang pandang besar, mitosis atipikal, clear cell kurang dari 25 persen, struktur difus, nekrosis, invasi vena, dan invasi struktur sinusoid atau kapsul. Adanya beberapa kriteria ini mengarah ke karsinoma adrenokortikal."},
{t:"C3-C4",s:"Pria 70 tahun dengan IMT 19,5 kg/m2 dan asupan makan hanya sekitar 40 persen kebutuhan selama 2 minggu. Menurut kriteria GLIM, diagnosis yang paling tepat adalah...",o:["Malnutrisi, karena IMT rendah (ambang Asia untuk usia 70 tahun atau lebih) dan asupan menurun","Normal, karena IMT masih mendekati normal","Hanya sarkopenia tanpa malnutrisi","Malnutrisi hanya jika albumin rendah","Tidak dapat ditentukan tanpa pengukuran massa lemak"],w:["Normal tidak sesuai, karena ambang IMT Asia untuk usia 70 tahun atau lebih adalah kurang dari 20 kg/m2, sehingga IMT 19,5 termasuk kriteria fenotipik.","Sarkopenia tidak sama dengan malnutrisi; kasus ini memenuhi kriteria GLIM, sehingga keduanya tidak disamakan.","Albumin bukan kriteria diagnostik GLIM, sehingga tidak diperlukan untuk menegakkan malnutrisi.","Pengukuran massa lemak bukan kriteria GLIM; GLIM menggunakan IMT dan kriteria lain yang tersedia."],e:"Untuk usia 70 tahun atau lebih, ambang IMT Asia pada GLIM adalah kurang dari 20 kg/m2, sehingga IMT 19,5 memenuhi kriteria fenotipik. Asupan kurang dari 50 persen kebutuhan selama lebih dari 1 minggu memenuhi kriteria etiologik. Jadi diagnosis malnutrisi ditegakkan."},
{t:"C3-C4",s:"Pria 60 tahun dengan BB 80 kg, turun menjadi 66 kg dalam 5 bulan. Menurut GLIM, derajat malnutrisi yang paling tepat adalah...",o:["Stadium 2 (berat), karena penurunan BB lebih dari 10 persen dalam 6 bulan","Stadium 1 (sedang), karena penurunan BB kurang dari 20 persen","Tidak malnutrisi, karena berat badan masih di atas 60 kg","Stadium 1 (sedang), karena penurunan BB kurang dari 5 persen","Tidak dapat ditentukan tanpa albumin serum"],w:["Stadium 1 tidak sesuai, karena penurunan lebih dari 10 persen dalam kurang dari 6 bulan termasuk derajat berat.","Penurunan BB kurang dari 20 persen tidak menentukan derajat sedang; ambang yang digunakan adalah penurunan dalam 6 bulan.","Berat badan di atas 60 kg tidak menyingkirkan malnutrisi; keparahan ditentukan oleh persentase penurunan.","Penurunan BB dalam kasus ini sekitar 17,5 persen, bukan kurang dari 5 persen, sehingga tidak sesuai."],e:"Penurunan BB dari 80 kg menjadi 66 kg adalah sekitar 17,5 persen dalam 5 bulan, yaitu lebih dari 10 persen dalam 6 bulan. Ini termasuk derajat berat atau stadium 2 menurut GLIM. Keparahan ditentukan oleh kriteria fenotipik, sehingga perlu pemeriksaan intervensi nutrisi segera."},
{t:"C3-C4",s:"Pasien dewasa 60 tahun tidak makan selama 12 hari karena penyakit berat, dengan penurunan BB yang bermakna. Nutrisi akan dimulai. Tindakan pencegahan refeeding syndrome yang paling tepat adalah...",o:["Menilai dan mengoreksi elektrolit, memberikan tiamin sesuai protokol, serta memulai nutrisi secara bertahap dengan pemantauan ketat","Langsung memberikan target energi penuh sejak hari pertama","Menunda pemeriksaan elektrolit sampai pasien makan normal","Memberikan karbohidrat dosis tinggi untuk mempercepat pemulihan","Menghentikan tiamin agar tidak mengganggu metabolisme"],w:["Target energi penuh sejak hari pertama meningkatkan risiko refeeding syndrome pada pasien dengan asupan sangat rendah berkepanjangan.","Pemeriksaan elektrolit harus dilakukan sebelum dan selama nutrisi pada pasien berisiko, tidak ditunda.","Karbohidrat dosis tinggi memicu pergeseran fosfat, kalium, dan magnesium ke dalam sel, sehingga meningkatkan risiko.","Tiamin diperlukan pada pasien berisiko refeeding sesuai protokol, sehingga menghentikannya tidak tepat."],e:"Pasien dengan asupan sangat rendah berkepanjangan dan penurunan BB berat berisiko tinggi refeeding syndrome. Pencegahannya meliputi penilaian dan koreksi elektrolit, pemberian tiamin sesuai protokol, dan pemulaan nutrisi secara bertahap dengan pemantauan ketat."},
{t:"C3-C4",s:"Pasien stroke dengan disfagia berat, tetapi saluran cerna berfungsi baik dan oral tidak aman. Rute nutrisi yang paling tepat menurut PPT adalah...",o:["Enteral melalui sonde dengan memperhatikan keamanan aspirasi, posisi kepala, dan toleransi","Parenteral total karena pasien tidak dapat menelan","Oral dengan makanan biasa tanpa modifikasi","Dekstrosa intravena saja","Menunda nutrisi sampai disfagia membaik"],w:["Parenteral total tidak dipilih bila saluran cerna masih berfungsi; parenteral dipertimbangkan bila saluran cerna tidak dapat digunakan.","Oral dengan makanan biasa berisiko aspirasi karena oral tidak aman pada kasus ini.","Dekstrosa intravena saja tidak memenuhi kebutuhan energi dan protein serta bukan rute yang tepat.","Menunda nutrisi sampai disfagia membaik berbahaya dan bertentangan dengan tujuan terapi nutrisi."],e:"Bila oral tidak aman tetapi usus berfungsi, nutrisi enteral melalui sonde menjadi pilihan sesuai algoritme PPT. Keamanan aspirasi, posisi kepala, toleransi, dan hidrasi perlu diperhatikan, serta asupan yang benar-benar masuk dievaluasi."},
{t:"C3-C4",s:"Pasien kanker dengan penurunan berat badan dan massa otot, tetapi nutrisi saja mungkin tidak cukup karena inflamasi yang kuat. Istilah yang tepat untuk kondisi wasting terkait penyakit dengan inflamasi ini adalah...",o:["Kakeksia","Sarkopenia","Malnutrisi nonspesifik","Obesitas sarkopenik","Atrofi fisiologis"],w:["Sarkopenia adalah penurunan kekuatan dan massa otot yang sering terkait penuaan, dan tidak selalu disertai inflamasi wasting seperti pada kasus ini.","Malnutrisi nonspesifik bukan istilah yang dibahas dalam PPT; diagnosis malnutrisi menggunakan kriteria GLIM yang spesifik.","Obesitas sarkopenik ditandai kombinasi obesitas dan kehilangan massa otot, tidak sesuai dengan penurunan berat badan terkait inflamasi.","Atrofi fisiologis merupakan perubahan normal akibat penuaan atau disuse, bukan wasting terkait penyakit dengan inflamasi."],e:"Kakeksia adalah sindrom wasting terkait penyakit yang sering disertai inflamasi, dan nutrisi saja mungkin tidak cukup. Malnutrisi, sarkopenia, dan kakeksia tidak boleh disamakan. Sarkopenia adalah kehilangan kekuatan dan massa otot, sedangkan malnutrisi memerlukan kriteria GLIM."}
];
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L="ABCDE";
let order=[],i=0,score=0,lv={};
function start(){
  order=sh(Q).map(q=>({q,o:sh(q.o.map((t,k)=>({t,c:k===0,r:k===0?"":q.w[k-1]})))}));
  i=0;score=0;lv={"C1-C2":[0,0],"C3-C4":[0,0]};show();
}
function show(){
  const app=document.getElementById('app');app.innerHTML='';
  if(i>=order.length){
    const c=$('div','card');
    c.append($('h3',null,'Hasil: '+score+' / '+order.length+' benar'));
    for(const k in lv)c.append($('p',null,k+': '+lv[k][0]+' / '+lv[k][1]+' benar'));
    const b=$('button','btn','Acak & Mulai Ulang');b.onclick=start;c.append(b);
    app.append(c);return;
  }
  const it=order[i];
  const pb=$('div','bar');const d=$('div');d.style.width=(i/order.length*100)+'%';pb.append(d);app.append(pb);
  const card=$('div','card');
  card.append($('p','tag','Soal '+(i+1)+' / '+order.length+'  ·  '+it.q.t));
  card.append($('p','stem',it.q.s));
  const btns=it.o.map((o,k)=>{
    const b=$('button','opt',L[k]+'. '+o.t);
    b.onclick=()=>pick(b,o,k);card.append(b);return b;
  });
  function pick(b,o,k){
    if(btns[0].disabled)return;
    btns.forEach(x=>x.disabled=true);
    lv[it.q.t][1]++;
    if(o.c){score++;lv[it.q.t][0]++;b.classList.add('ok');}
    else{b.classList.add('bad');btns[it.o.findIndex(x=>x.c)].classList.add('ok');}
    const ex=$('div','exp');
    const ci=it.o.findIndex(x=>x.c);
    ex.append($('p',null,'Jawaban benar: '+L[ci]+'. '+it.o[ci].t));
    ex.append($('p',null,it.q.e));
    ex.append($('h4',null,'Mengapa opsi lain tidak tepat:'));
    const ul=$('ul');
    it.o.forEach((x,j)=>{if(!x.c)ul.append($('li',null,L[j]+'. '+x.t+' → '+x.r));});
    ex.append(ul);
    card.append(ex);
    const nb=$('button','btn',i+1<order.length?'Soal Berikutnya':'Lihat Hasil');
    nb.onclick=()=>{i++;show();};card.append(nb);
  }
  app.append(card);
}
start();
</script>
